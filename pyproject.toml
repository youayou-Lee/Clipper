[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"
version = "0.1.0"
description = "Clipboard guardian: detects verified Bitcoin/Ethereum addresses in your clipboard and warns you before you paste"
requires-python = ">=3.10"
dependencies = ["pycryptodome>=3.19"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]
