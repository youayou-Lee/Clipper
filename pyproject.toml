[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipper"  # 案例一模块名,保留历史(仓库已更名 TrapLab)
version = "0.1.0"
description = "Clipboard guardian: detects verified Bitcoin/Ethereum addresses in your clipboard and warns you before you paste"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.19",
    "pyyaml>=6.0.3",
]

[project.scripts]
clipper = "clipper.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["clipper*"]
