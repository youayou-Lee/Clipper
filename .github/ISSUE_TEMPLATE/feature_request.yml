name: 功能(Feature)
description: 新功能或对现有功能的改进——先有可测试的验收标准,再开工
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 讲清场景与痛点,而不是"实现 X"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准(≥3 条,每条可测试)
      description: 不写"体验更好",写可执行的验证,如"`clipper scan --json` 输出包含字段 X"
      placeholder: |
        1. [ ] …
        2. [ ] …
        3. [ ] …
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 设计要点(开工前补)
      description: 模块划分、接缝(改哪些文件)、测试计划;关键决策列 A/B 备选 + 取舍理由
  - type: input
    id: estimate
    attributes:
      label: 预估工作量
      description: 1-3 天;估超 → 拆成子 Issue
